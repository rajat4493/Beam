services:
  - type: web
    name: beam-staging-web
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: PILOT_ADMIN_TOKEN
        sync: false
      - key: OUTBOX_WORKER_TOKEN
        sync: false
  - type: worker
    name: beam-staging-outbox
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker:start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: OUTBOX_WORKER_TOKEN
        sync: false
